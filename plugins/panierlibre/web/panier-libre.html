<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panier Libre - Enbauges</title>
  <meta name="description" content="Réservez des paniers et lots auprès des producteurs du Massif des Bauges">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
  <link href="/css/enbauges.css" rel="stylesheet">
  <style>
    :root {
      --pl-bg: #FAF8F5;
      --pl-bg-warm: #F5F0E8;
      --pl-bg-card: #FFFFFF;
      --pl-text: #3D3229;
      --pl-text-dim: #8B7E74;
      --pl-text-bright: #2A2118;
      --pl-sage: #7A9E7E;
      --pl-sage-dark: #5B8060;
      --pl-sage-light: rgba(122,158,126,0.12);
      --pl-terracotta: #C4704B;
      --pl-terracotta-light: rgba(196,112,75,0.12);
      --pl-amber: #D4A843;
      --pl-amber-light: rgba(212,168,67,0.12);
      --pl-blue: #5B8DB8;
      --pl-blue-light: rgba(91,141,184,0.12);
      --pl-border: #E5DFD6;
      --pl-border-focus: #7A9E7E;
      --pl-shadow: 0 2px 8px rgba(61,50,41,0.08);
      --pl-shadow-lg: 0 8px 24px rgba(61,50,41,0.12);
      --pl-radius: 0.75rem;
      --pl-radius-sm: 0.5rem;
      --pl-transition: 200ms ease;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--pl-bg);
      color: var(--pl-text);
      min-height: 100vh;
    }

    /* ─── App ─────────────────────────────────────────────────────── */
    .pl-app {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* ─── Navbar ──────────────────────────────────────────────────── */
    .pl-navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1.5rem;
      background: var(--pl-bg-card);
      border-bottom: 1px solid var(--pl-border);
      box-shadow: var(--pl-shadow);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .pl-navbar__left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .pl-navbar__home {
      font-size: 1.25rem;
      text-decoration: none;
      transition: transform var(--pl-transition);
    }
    .pl-navbar__home:hover { transform: scale(1.1); }
    .pl-navbar__title {
      font-family: 'Merriweather', serif;
      font-size: 1.125rem;
      font-weight: 700;
      color: var(--pl-text-bright);
    }
    .pl-navbar__right {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* ─── Main content ────────────────────────────────────────────── */
    .pl-main {
      flex: 1;
      max-width: 56rem;
      width: 100%;
      margin: 0 auto;
      padding: 1.5rem 1rem 3rem;
    }

    /* ─── Buttons ─────────────────────────────────────────────────── */
    .pl-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      font-family: 'Inter', system-ui, sans-serif;
      font-weight: 600;
      cursor: pointer;
      border: none;
      border-radius: var(--pl-radius-sm);
      transition: all var(--pl-transition);
      line-height: 1;
    }
    .pl-btn:active { transform: scale(0.97); }
    .pl-btn--primary {
      background: var(--pl-sage);
      color: white;
      padding: 0.625rem 1.25rem;
      font-size: 0.875rem;
    }
    .pl-btn--primary:hover { background: var(--pl-sage-dark); }
    .pl-btn--small {
      background: var(--pl-bg-warm);
      color: var(--pl-text);
      padding: 0.375rem 0.75rem;
      font-size: 0.75rem;
      border: 1px solid var(--pl-border);
    }
    .pl-btn--small:hover { background: var(--pl-sage-light); border-color: var(--pl-sage); }
    .pl-btn--admin {
      background: var(--pl-bg-warm);
      color: var(--pl-text-dim);
      border: 1px solid var(--pl-border);
    }
    .pl-btn--admin:hover { color: var(--pl-terracotta); border-color: var(--pl-terracotta); background: var(--pl-terracotta-light); }
    .pl-btn--danger {
      background: #FEE2E2;
      color: #991B1B;
      border: 1px solid #FECACA;
    }
    .pl-btn--danger:hover { background: #FCA5A5; }

    /* ─── Form ────────────────────────────────────────────────────── */
    .pl-form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .pl-label {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--pl-text-dim);
    }
    .pl-label--flex { flex: 1; }
    .pl-input {
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 0.875rem;
      padding: 0.5rem 0.75rem;
      border: 1.5px solid var(--pl-border);
      border-radius: var(--pl-radius-sm);
      background: var(--pl-bg-card);
      color: var(--pl-text);
      transition: border-color var(--pl-transition), box-shadow var(--pl-transition);
      width: 100%;
    }
    .pl-input:focus {
      outline: none;
      border-color: var(--pl-border-focus);
      box-shadow: 0 0 0 3px var(--pl-sage-light);
    }
    .pl-input::placeholder { color: var(--pl-text-dim); opacity: 0.6; }
    .pl-input--textarea { resize: vertical; min-height: 3rem; }
    .pl-input--item-key { flex: 2; }
    .pl-input--item-qty { flex: 1; min-width: 4rem; }
    .pl-form-row {
      display: flex;
      gap: 0.75rem;
    }
    .pl-error {
      background: #FEE2E2;
      color: #991B1B;
      padding: 0.5rem 0.75rem;
      border-radius: var(--pl-radius-sm);
      font-size: 0.8125rem;
    }
    .pl-hint {
      font-size: 0.8125rem;
      color: var(--pl-text-dim);
      line-height: 1.5;
    }

    /* ─── Item row ────────────────────────────────────────────────── */
    .pl-item-row {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      margin-bottom: 0.375rem;
    }
    .pl-item-remove {
      background: none;
      border: 1px solid var(--pl-border);
      border-radius: var(--pl-radius-sm);
      color: var(--pl-text-dim);
      cursor: pointer;
      padding: 0.25rem 0.5rem;
      font-size: 0.75rem;
      transition: all var(--pl-transition);
    }
    .pl-item-remove:hover { color: #991B1B; border-color: #FCA5A5; background: #FEE2E2; }
    .pl-item-remove:disabled { opacity: 0.3; cursor: not-allowed; }

    /* ─── Select ──────────────────────────────────────────────────── */
    .pl-select {
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 0.875rem;
      padding: 0.5rem 0.75rem;
      border: 1.5px solid var(--pl-border);
      border-radius: var(--pl-radius-sm);
      background: var(--pl-bg-card);
      color: var(--pl-text);
      cursor: pointer;
      transition: border-color var(--pl-transition);
    }
    .pl-select:focus {
      outline: none;
      border-color: var(--pl-border-focus);
    }

    /* ─── Status badge ────────────────────────────────────────────── */
    .pl-status {
      display: inline-flex;
      align-items: center;
      padding: 0.125rem 0.5rem;
      border-radius: 9999px;
      font-size: 0.6875rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }
    .pl-status--incoming {
      background: var(--pl-blue-light);
      color: var(--pl-blue);
    }
    .pl-status--ongoing {
      background: var(--pl-sage-light);
      color: var(--pl-sage-dark);
    }
    .pl-status--finished {
      background: #F3F4F6;
      color: #9CA3AF;
    }

    /* ─── Tags ────────────────────────────────────────────────────── */
    .pl-tag {
      display: inline-flex;
      align-items: center;
      padding: 0.1875rem 0.5rem;
      background: var(--pl-bg-warm);
      border: 1px solid var(--pl-border);
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--pl-text);
      white-space: nowrap;
    }
    .pl-tag--empty {
      background: #FEE2E2;
      border-color: #FECACA;
      color: #991B1B;
    }

    /* ─── Filter bar ──────────────────────────────────────────────── */
    .pl-filter-bar {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    /* ─── Baskets grid ───────────────────────────────────────────── */
    .pl-baskets-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(18rem, 1fr));
      gap: 1rem;
    }

    /* ─── Basket card ────────────────────────────────────────────── */
    .pl-basket-card {
      background: var(--pl-bg-card);
      border: 1px solid var(--pl-border);
      border-radius: var(--pl-radius);
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      box-shadow: var(--pl-shadow);
      transition: box-shadow var(--pl-transition), transform var(--pl-transition);
    }
    .pl-basket-card:hover {
      box-shadow: var(--pl-shadow-lg);
      transform: translateY(-1px);
    }
    .pl-basket-card__header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .pl-basket-card__provider {
      font-size: 0.75rem;
      color: var(--pl-text-dim);
      font-weight: 500;
    }
    .pl-basket-card__title {
      font-family: 'Merriweather', serif;
      font-size: 1.0625rem;
      font-weight: 700;
      color: var(--pl-text-bright);
      line-height: 1.3;
    }
    .pl-basket-card__desc {
      font-size: 0.8125rem;
      color: var(--pl-text-dim);
      line-height: 1.5;
    }
    .pl-basket-card__items {
      display: flex;
      flex-wrap: wrap;
      gap: 0.375rem;
    }
    .pl-basket-card__dates {
      font-size: 0.8125rem;
      color: var(--pl-text-dim);
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }
    .pl-basket-card__closed {
      font-size: 0.8125rem;
      color: #9CA3AF;
      font-weight: 500;
    }

    /* ─── Empty state ────────────────────────────────────────────── */
    .pl-empty {
      text-align: center;
      padding: 3rem 1rem;
    }
    .pl-empty__icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }

    /* ─── Section title ──────────────────────────────────────────── */
    .pl-section-title {
      font-family: 'Merriweather', serif;
      font-size: 1.125rem;
      font-weight: 700;
      color: var(--pl-text-bright);
      margin: 2rem 0 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 2px solid var(--pl-border);
    }

    /* ─── Provider card ───────────────────────────────────────────── */
    .pl-providers-section { margin-top: 1rem; }
    .pl-provider-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 1rem;
      background: var(--pl-bg-card);
      border: 1px solid var(--pl-border);
      border-radius: var(--pl-radius-sm);
      margin-bottom: 0.5rem;
      transition: box-shadow var(--pl-transition);
    }
    .pl-provider-card:hover { box-shadow: var(--pl-shadow); }
    .pl-provider-card__info {
      display: flex;
      flex-direction: column;
      gap: 0.125rem;
    }
    .pl-provider-card__name {
      font-weight: 600;
      font-size: 0.9375rem;
      color: var(--pl-text-bright);
    }
    .pl-provider-card__desc {
      font-size: 0.75rem;
      color: var(--pl-text-dim);
    }
    .pl-provider-card__addr {
      font-size: 0.75rem;
      color: var(--pl-text-dim);
    }
    .pl-provider-card__actions {
      display: flex;
      gap: 0.375rem;
      flex-shrink: 0;
    }

    /* ─── Modal ──────────────────────────────────────────────────── */
    .pl-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(61,50,41,0.4);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 1rem;
    }
    .pl-modal {
      background: var(--pl-bg-card);
      border-radius: var(--pl-radius);
      box-shadow: var(--pl-shadow-lg);
      width: 100%;
      max-width: 32rem;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .pl-modal__header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--pl-border);
    }
    .pl-modal__title {
      font-family: 'Merriweather', serif;
      font-size: 1.0625rem;
      font-weight: 700;
      color: var(--pl-text-bright);
    }
    .pl-modal__close {
      background: none;
      border: none;
      color: var(--pl-text-dim);
      cursor: pointer;
      font-size: 1.25rem;
      padding: 0.25rem;
      line-height: 1;
      transition: color var(--pl-transition);
    }
    .pl-modal__close:hover { color: var(--pl-text); }
    .pl-modal__body {
      padding: 1.25rem;
      overflow-y: auto;
    }

    /* ─── Booking item selector ──────────────────────────────────── */
    .pl-booking-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.375rem;
    }
    .pl-booking-item__key {
      flex: 2;
      font-size: 0.875rem;
      font-weight: 500;
    }
    .pl-booking-item__avail {
      font-size: 0.75rem;
      color: var(--pl-sage-dark);
      font-weight: 600;
      min-width: 4rem;
    }
    .pl-booking-item .pl-input--item-qty { flex: 1; min-width: 3.5rem; }

    /* ─── Lookup results ─────────────────────────────────────────── */
    .pl-lookup-results {
      margin-top: 1rem;
      border-top: 1px solid var(--pl-border);
      padding-top: 1rem;
    }
    .pl-lookup-card {
      background: var(--pl-bg-warm);
      border: 1px solid var(--pl-border);
      border-radius: var(--pl-radius-sm);
      padding: 0.75rem 1rem;
      margin-bottom: 0.5rem;
    }
    .pl-lookup-card__header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 0.375rem;
    }
    .pl-lookup-card__provider {
      font-weight: 600;
      font-size: 0.875rem;
      color: var(--pl-text-bright);
    }
    .pl-lookup-card__basket {
      font-size: 0.8125rem;
      color: var(--pl-text);
    }
    .pl-lookup-card__items {
      display: flex;
      flex-wrap: wrap;
      gap: 0.25rem;
      margin-bottom: 0.375rem;
    }
    .pl-lookup-card__meta {
      display: flex;
      gap: 0.75rem;
      font-size: 0.75rem;
      color: var(--pl-text-dim);
      flex-wrap: wrap;
    }
    .pl-lookup-card__actions {
      display: flex;
      gap: 0.375rem;
      margin-top: 0.5rem;
    }

    /* ─── Admin view ─────────────────────────────────────────────── */
    .pl-admin__header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 2px solid var(--pl-border);
    }
    .pl-admin__provider-name {
      font-family: 'Merriweather', serif;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--pl-text-bright);
    }
    .pl-admin__actions {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .pl-admin-baskets { display: flex; flex-direction: column; gap: 0.75rem; }
    .pl-admin-basket {
      background: var(--pl-bg-card);
      border: 1px solid var(--pl-border);
      border-radius: var(--pl-radius-sm);
      overflow: hidden;
      transition: box-shadow var(--pl-transition);
    }
    .pl-admin-basket--selected {
      border-color: var(--pl-sage);
      box-shadow: 0 0 0 2px var(--pl-sage-light);
    }
    .pl-admin-basket__header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.875rem 1rem;
      cursor: pointer;
      transition: background var(--pl-transition);
    }
    .pl-admin-basket__header:hover { background: var(--pl-bg-warm); }
    .pl-admin-basket__title {
      font-weight: 600;
      font-size: 0.9375rem;
      margin-left: 0.5rem;
    }
    .pl-admin-basket__dates {
      font-size: 0.8125rem;
      color: var(--pl-text-dim);
    }
    .pl-admin-basket__detail {
      padding: 1rem;
      border-top: 1px solid var(--pl-border);
    }
    .pl-admin-basket__actions {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.75rem;
    }

    /* ─── Admin bookings ─────────────────────────────────────────── */
    .pl-admin-bookings {
      margin-top: 1.25rem;
      padding-top: 1rem;
      border-top: 1px solid var(--pl-border);
    }
    .pl-admin-bookings__title {
      font-size: 0.9375rem;
      font-weight: 700;
      color: var(--pl-text-bright);
      margin-bottom: 0.75rem;
    }
    .pl-bookings-list { display: flex; flex-direction: column; gap: 0.5rem; }
    .pl-booking-card {
      background: var(--pl-bg-warm);
      border: 1px solid var(--pl-border);
      border-radius: var(--pl-radius-sm);
      padding: 0.75rem 1rem;
    }
    .pl-booking-card__header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.375rem;
    }
    .pl-booking-card__name {
      font-weight: 600;
      font-size: 0.875rem;
      color: var(--pl-text-bright);
    }
    .pl-booking-card__date {
      font-size: 0.75rem;
      color: var(--pl-text-dim);
    }
    .pl-booking-card__contact {
      display: flex;
      gap: 0.75rem;
      font-size: 0.8125rem;
      color: var(--pl-text);
      margin-bottom: 0.375rem;
    }
    .pl-booking-card__items {
      display: flex;
      flex-wrap: wrap;
      gap: 0.25rem;
      margin-bottom: 0.375rem;
    }
    .pl-booking-card__notes {
      font-size: 0.8125rem;
      color: var(--pl-text-dim);
      font-style: italic;
      margin-bottom: 0.5rem;
    }
    .pl-booking-card__actions {
      display: flex;
      gap: 0.375rem;
      margin-top: 0.5rem;
    }

    /* ─── Toast ──────────────────────────────────────────────────── */
    .pl-toast {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%) translateY(1rem);
      padding: 0.625rem 1.25rem;
      border-radius: 9999px;
      font-size: 0.8125rem;
      font-weight: 600;
      z-index: 9999;
      opacity: 0;
      transition: opacity 300ms ease, transform 300ms ease;
      white-space: nowrap;
    }
    .pl-toast--visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    .pl-toast--success {
      background: var(--pl-sage);
      color: white;
    }
    .pl-toast--error {
      background: #EF4444;
      color: white;
    }

    /* ─── Mobile responsive ───────────────────────────────────────── */
    @media (max-width: 640px) {
      .pl-main { padding: 1rem 0.75rem 2rem; }
      .pl-baskets-grid {
        grid-template-columns: 1fr;
      }
      .pl-form-row {
        flex-direction: column;
        gap: 1rem;
      }
      .pl-provider-card {
        flex-direction: column;
        gap: 0.75rem;
        align-items: flex-start;
      }
      .pl-admin__header {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.75rem;
      }
      .pl-admin-basket__header {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.25rem;
      }
      .pl-navbar {
        padding: 0.625rem 0.75rem;
      }
      .pl-navbar__title {
        font-size: 0.9375rem;
      }
      .pl-filter-bar {
        flex-direction: column;
        align-items: stretch;
      }
      .pl-filter-bar .pl-select { width: 100%; }
      .pl-booking-item {
        flex-wrap: wrap;
      }
      .pl-booking-item__key { flex: 1 1 60%; }
      .pl-booking-item__avail { flex: 0; }
    }
  </style>
</head>
<body>
  <div id="panier-libre-root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="/plugin-static/panier-libre/panier-libre-helpers.js"></script>
  <script src="/plugin-static/panier-libre/panier-libre-app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var root = document.getElementById('panier-libre-root');
      var app = React.createElement(PanierLibreApp.App);
      ReactDOM.createRoot(root).render(app);
    });
  </script>
</body>
</html>
